services:
  backend:
    build: ./backend
    container_name: smartlock_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - AI_SERVICE_URL=https://spearhead-lens-cardstock.ngrok-free.dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: smartlock_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped